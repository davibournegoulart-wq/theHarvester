name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netscraper
          POSTGRES_PASSWORD: netscraper
          POSTGRES_DB: netscraper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NETSCRAPER_DATABASE_URL: postgresql+asyncpg://netscraper:netscraper@localhost:5432/netscraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax (all modules importable)
        run: python -c "import app.main"

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        # Parte da suíte faz request HTTP real a serviço público (ver
        # test_username_checker.py) — pode ficar instável sob rate-limit,
        # mesmo trade-off documentado no README/vault. Postgres real acima
        # destrava os testes de integração de case/incident.py e das
        # rotas /cases/* (antes rodavam só manualmente, nunca em CI).
        run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx next build
