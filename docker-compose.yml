services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netscraper
      POSTGRES_PASSWORD: netscraper
      POSTGRES_DB: netscraper
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - netscraper_pgdata:/var/lib/postgresql/data

  tor:
    image: dockurr/tor
    ports:
      - "127.0.0.1:9050:9050"
    restart: unless-stopped

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      NETSCRAPER_DATABASE_URL: postgresql+asyncpg://netscraper:netscraper@postgres:5432/netscraper
      NETSCRAPER_TOR_PROXY_URL: socks5://tor:9050
      # NETSCRAPER_API_KEY: troque isso antes de expor o serviço fora de localhost
      # (default inseguro documentado em app/auth.py, funciona pra dev local)
      # Lidos de um arquivo .env local (já no .gitignore, nunca vai pro GitHub) —
      # crie um arquivo .env na raiz com essas chaves em vez de editar aqui. Ver README#Conta Google.
      NETSCRAPER_GOOGLE_SESSION_COOKIES: ${NETSCRAPER_GOOGLE_SESSION_COOKIES:-}
      NETSCRAPER_OPENSANCTIONS_API_KEY: ${NETSCRAPER_OPENSANCTIONS_API_KEY:-}
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      - postgres
      - tor
    volumes:
      - ./backend/app:/app/app
      - ./data/bulk_uploads:/data/bulk_uploads

  web:
    build: ./frontend
    ports:
      - "3100:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8100
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  netscraper_pgdata:
